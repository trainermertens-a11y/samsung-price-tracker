name: Daily Samsung BE price update

on:
  schedule:
    # Runs every day at 05:00 UTC (06:00 in winter, 07:00 in summer in Belgium)
    - cron: "0 5 * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed so the workflow can commit the updated files

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check that samsung.com can be reached
        run: |
          echo "HTTP status from samsung.com/be:"
          curl -s -o /tmp/samsung.html -w "%{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0" https://www.samsung.com/be/smartphones/all-smartphones/ || true
          echo "Size of HTML received:"; wc -c /tmp/samsung.html || true
          echo "First 500 characters:"; head -c 500 /tmp/samsung.html || true

      - name: Scrape prices
        run: python scrape_prices.py

      - name: Commit updated prices
        run: |
          mkdir -p docs
          touch docs/.nojekyll   # tells GitHub Pages to serve files as-is (no Jekyll build)
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F)"
          git push

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: docs/debug.png
          if-no-files-found: ignore
